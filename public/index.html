<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ShelfLife</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="title">📦 ShelfLife</div>
        <button id="btn-refresh" class="icon-btn" aria-label="Обновить">⟳</button>
      </header>

      <nav id="tabs">
        <button class="tab active" data-tab="list">Продукты</button>
        <button class="tab" data-tab="settings">Настройки</button>
      </nav>

      <main id="content">
        <div class="loader">Загрузка…</div>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
